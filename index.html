<!DOCTYPE html>
<html lang="en" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExamPrep — JKSSB &amp; SSC CGL</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    };
  </script>

  <!-- KaTeX for Math Rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-200">

  <!-- Top Navbar -->
  <header class="sticky top-0 z-30 bg-white/90 dark:bg-slate-900/90 backdrop-blur border-b border-slate-200 dark:border-slate-800">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-brand-600 text-white font-bold flex items-center justify-center text-sm">
          EP
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight">ExamPrep</h1>
          <p class="text-xs text-slate-500 dark:text-slate-400">JKSSB &amp; SSC CGL</p>
        </div>
      </div>

      <!-- Navigation Tabs -->
      <nav id="main-nav" class="flex items-center gap-1 overflow-x-auto py-1">
        <button onclick="switchTab('practice')" data-tab="practice" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-medium transition">Practice</button>
        <button onclick="switchTab('ai')" data-tab="ai" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-medium transition">✨ Find Online</button>
        <button onclick="switchTab('mock')" data-tab="mock" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-medium transition">Mock Test</button>
        <button onclick="switchTab('revision')" data-tab="revision" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-medium transition">
          Revision <span id="mistake-badge" class="ml-1 text-xs px-1.5 py-0.5 rounded-full bg-rose-100 text-rose-700 dark:bg-rose-900/50 dark:text-rose-300 hidden">0</span>
        </button>
        <button onclick="switchTab('manage')" data-tab="manage" class="nav-btn px-3 py-1.5 rounded-lg text-sm font-medium transition">Manage Questions</button>
      </nav>

      <!-- Dark Mode Toggle -->
      <button onclick="toggleTheme()" id="theme-toggle" title="Toggle Dark/Light Mode"
        class="p-2 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition text-sm">
        <span id="theme-icon">🌙</span>
      </button>
    </div>
  </header>

  <!-- Main Content Container -->
  <main id="app-root" class="max-w-6xl mx-auto px-4 py-6"></main>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium text-white bg-slate-900 dark:bg-brand-600 transition-opacity"></div>

  <script src="questions.js"></script>
  <script src="app.js"></script>
  <script src="ai-finder.js"></script>
</body>
</html>
